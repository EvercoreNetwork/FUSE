<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{--bg:#242424;--bg-deep:#161616;--border:#ffffff14;--text:#f2f2f2;--muted:#aeaeae}
  *{box-sizing:border-box;margin:0;padding:0}
  /* Transparent page - WebKit view and Gtk window are also set transparent in Python
     so only the .tray card is opaque. Without !important some WebKit versions force white. */
  html,body{height:auto;background:transparent !important;background-color:transparent !important;font-family:ui-sans-serif,system-ui,sans-serif}
  html{background:transparent !important;background-color:transparent !important} body{background:transparent !important;background-color:transparent !important;padding:0;margin:0}
  .tray{
    width:320px;background:#1a1a1a;border:1px solid #ffffff14;border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    overflow:hidden;padding:8px;
    /* synced with window fade+slide (190ms) - subtle inner */
    animation:trayIn .16s cubic-bezier(.16,1,.3,1);
  }
  @keyframes trayIn{
    from{opacity:0;transform:translateY(4px)}
    to{opacity:1;transform:translateY(0)}
  }
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;font-size:11px;font-weight:600;color:#aeaeae;letter-spacing:.02em;
  }
  .header span{color:#f2f2f2}
  .sep{height:1px;background:#ffffff0f;margin:4px 4px}
  .item{
    height:38px;display:grid;grid-template-columns:20px 1fr 20px;align-items:center;
    padding:0 10px;border-radius:8px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
    color:#f2f2f2;cursor:pointer;transition:all .12s;border:1px solid transparent;
  }
  .item:hover{background:#ffffff0f;border-color:#ffffff0a;transform:translateY(-1px)}
  .item:active{transform:scale(.98)}
  .item .star{color:#fff;opacity:1;display:grid;place-items:center;font-size:14px;line-height:1}
  .item .star:first-child{justify-self:start}
  .item .star:last-child{justify-self:end}
  .item .label{text-align:center}
</style>
</head>
<body>
<div class="tray" id="tray">
  <div class="header"><span>✦✦</span><span>NEXAURA FUSE <span style="color:#5c5c5c">•</span> <span id="hdr">45GB free • 1 models</span></span><span>✦✦</span></div>
  <div class="sep"></div>
  <div class="item" data-act="dashboard"><span class="star">✦</span><span class="label">DASHBOARD</span><span class="star">✦</span></div>
  <div class="item" data-act="merge"><span class="star">✦</span><span class="label">MERGE ALL</span><span class="star">✦</span></div>
  <div class="item" data-act="settings"><span class="star">✦</span><span class="label">SETTINGS</span><span class="star">✦</span></div>
  <div class="sep"></div>
  <div class="item" data-act="quit"><span class="star">✦</span><span class="label">QUIT FUSE</span><span class="star">✦</span></div>
</div>
<script>
  function call(action){
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.fuse){
      window.webkit.messageHandlers.fuse.postMessage(JSON.stringify({action}));
    } else if(window.pywebview){
      window.pywebview.api.invoke(action);
    } else {
      fetch('http://127.0.0.1:8765/api/'+action).catch(()=>{});
    }
  }
  document.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('click',()=>{
      const act=el.dataset.act;
      call(act);
    });
  });
  // update header from status
  fetch('http://127.0.0.1:8765/api/status').then(r=>r.json()).then(s=>{
    document.getElementById('hdr').textContent=`${s.disk} • ${s.models} models`;
  }).catch(()=>{});
</script>
</body>
</html>
